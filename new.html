<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Request Dashboard</title>
<style>
body{font-family:Segoe UI,sans-serif;margin:0;background:#f5f6fa}
.sidebar{width:240px;height:100vh;background:#0f172a;color:#fff;position:fixed}
.logo{padding:20px;font-size:24px;font-weight:bold}
.menu a{display:block;color:#fff;text-decoration:none;padding:15px 20px}
.menu a:hover,.active{background:#dc2626}
.main{margin-left:240px;padding:30px}
.cards{display:flex;gap:20px;margin-bottom:20px}
.card{background:#fff;padding:20px;border-radius:10px;flex:1;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h3{margin:0;color:#666}
.card .num{font-size:36px;font-weight:bold}
.table-wrap{background:#fff;padding:20px;border-radius:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}
.badge{padding:5px 10px;border-radius:20px;font-size:12px}
.new{background:#dbeafe;color:#1d4ed8}
.req{background:#fef3c7;color:#92400e}
.sub{background:#dcfce7;color:#166534}
.done{background:#e5e7eb}
.btn{background:#dc2626;color:#fff;padding:8px 16px;border-radius:5px;text-decoration:none}
.search-input {
    width: 250px;
    padding: 9px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
}

.search-input:focus {
    border-color: #2563eb;
}

.status-filter {
    padding: 9px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
    font-size: 14px;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="sidebar">
<div class="logo">AIRA & AIFUL</div>
<div class="menu">
<a href="dashboard.html">Dashboard</a>
<a class="active">New</a>
<a href="requested.html">Requested</a>
<a href="submitted.html">Submitted</a>
<a href="done.html">Done</a>
</div>
</div>




<div class="main">
 <h2>New Cases</h2>

<table>
    <div class="table-header">
        <div class="filter-group">

            <input
                type="text"
                id="caseSearch"
                class="search-input"
                placeholder="Search Customer / Customer No..."
                onkeyup="filterCases()"
            >
	</div>
        </div>
<thead>
<tr>
<th>Register Date</th>
<th>Customer No</th>
<th>Customer Name</th>
<th>Status</th>
<th>Request Count</th>
<th>Aging</th>
<th>Last Update</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>10/08/2569</td>
<td> <a href="case-detail.html">30000000001</a></td>
<td>น.ส.ปริบานชู แสงทอง</td>
<td><span class="badge new">New</span></td>
<td>0</td>
<td>0</td>
<td>15/08/2566 11:20</td>
</tr>

<tr>
<td>11/08/2569</td>
<td> <a href="case-detail.html">30000000002</a></td>
<td>น.ส.วราภรณ์ รุ่งเรือง</td>
<td><span class="badge new">New</span></td>
<td>0</td>
<td>0</td>
<td>15/08/2566 10:15</td>
</tbody>
</table>
</div>

</div>
<script>
function filterCases() {

    const searchInput = document
        .getElementById("caseSearch")
        .value
        .toLowerCase();

    const statusFilter = document
        .getElementById("statusFilter")
        .value
        .toLowerCase();

    const rows = document.querySelectorAll("#caseTable tbody tr");

    rows.forEach(row => {

        const rowText = row.textContent.toLowerCase();

        const status = row
            .querySelector(".badge")
            ?.textContent
            .toLowerCase() || "";

        const matchSearch = rowText.includes(searchInput);

        const matchStatus =
            statusFilter === "" ||
            status === statusFilter;

        if (matchSearch && matchStatus) {
            row.style.display = "";
        } else {
            row.style.display = "none";
        }

    });
}
</script>
</body>
</html>
